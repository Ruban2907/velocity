name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Security audit (critical vulnerabilities)
        run: npm audit --audit-level=critical

      - name: Run unit and integration tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-minimum-32-chars
          JWT_EXPIRES_IN: 1h
          PORT: 3000

      - name: Check test coverage thresholds
        run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-minimum-32-chars
          JWT_EXPIRES_IN: 1h
          PORT: 3000

  frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Security audit (critical vulnerabilities)
        run: npm audit --audit-level=critical

      - name: Run frontend unit and component tests
        run: npm test

      - name: TypeScript typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Production build
        run: npm run build
